name: cham_cong_tram
description: Ứng dụng chấm công thông minh cho doanh nghiệp Việt Nam
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  # Location & WiFi
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  network_info_plus: ^6.0.1
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.11
  # Excel Export
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  # UI & UX
  go_router: ^14.3.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  intl: any
  # Notifications
  flutter_local_notifications: ^18.0.1
  # Utils
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  image_picker: ^1.1.2
  flutter_animate: ^4.5.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "assets/images/logo_padded.png"
  adaptive_icon_foreground: "assets/images/transparent.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/

